<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="戰術RPG v2.5.4">
<meta name="format-detection" content="telephone=no">
<title>Elysion Clockwork 垂直切片 v2.5.4 — 30柱完整整合・BGM2立繪工坊・漫畫沙盤</title>
<style>
:root{
  --bg:#0f1115; --panel:#171a21; --panel2:#1e222b; --line:#2a2f3a;
  --fg:#dfe3ea; --dim:#8b93a3; --acc:#6ea8fe; --ok:#5bd18b; --warn:#e8b84b; --bad:#e4695e;
  --magic:#b48cf2; --phys:#e0975a;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--fg);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang TC","Microsoft JhengHei",sans-serif;
  font-size:14px;line-height:1.5;-webkit-text-size-adjust:100%}
select,input,button{background:var(--panel2);color:var(--fg);border:1px solid var(--line);
  border-radius:5px;padding:7px 10px;font-size:13px;font-family:inherit}
button{cursor:pointer}
button:active{transform:scale(.98)}
button.primary{background:var(--acc);color:#0b0d12;border-color:var(--acc);font-weight:600}
button.big{width:100%;padding:13px;font-size:15px;font-weight:600}

/* ── 頂部：僅模式切換，不放任何設計者工具 ── */
header{padding:8px 12px;background:var(--panel);border-bottom:1px solid var(--line);
  display:flex;gap:8px;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:10;flex-wrap:wrap}
header .title{font-size:13px;font-weight:600;letter-spacing:.5px}
header .phase{color:var(--dim);font-size:11px}
.modesw{display:flex;gap:0;border:1px solid var(--line);border-radius:5px;overflow:hidden}
.modesw button{border:none;border-radius:0;background:var(--panel2);color:var(--dim);
  padding:5px 9px;font-size:11px}
.modesw button.on{background:var(--acc);color:#0b0d12;font-weight:600}

/* ── 階段畫面：一次只顯示一個 ── */
.screen{display:none;padding:10px;max-width:760px;margin:0 auto}
.screen.on{display:block}

.card{background:var(--panel);border:1px solid var(--line);border-radius:7px;
  overflow:hidden;margin-bottom:10px}
.card>h2{margin:0;padding:8px 11px;font-size:12px;font-weight:600;background:var(--panel2);
  border-bottom:1px solid var(--line);color:var(--dim);letter-spacing:.5px}
.card>.body{padding:10px}
.hint{color:var(--dim);font-size:11.5px;line-height:1.6}

/* ── 計劃畫面：單位卡片 ── */
.unitcard{border:1px solid var(--line);border-radius:6px;margin-bottom:9px;background:var(--panel2);transition:border-color .15s}
.unitcard.drag-over{border:2px dashed #38bdf8;background:rgba(56,189,248,.08)}
.unitcard>.hd{padding:8px 10px;display:flex;justify-content:space-between;align-items:center;gap:8px;
  border-bottom:1px solid var(--line);flex-wrap:wrap}
.unitcard>.hd b{font-size:13.5px}
.unitcard>.hd .sub{color:var(--dim);font-size:10.5px}
.slotpick{width:82px}
.stats{display:flex;gap:7px;flex-wrap:wrap;padding:7px 10px;color:var(--dim);font-size:11px;
  border-bottom:1px solid #232833}
.stats span b{color:var(--fg);font-weight:600}
.budget{padding:6px 10px;font-size:11.5px;border-top:1px solid var(--line)}
.budget.over{color:var(--bad);font-weight:700}
.budget.ok{color:var(--ok)}

.line{border-top:1px solid #232833;padding:7px 10px}
.line.off{opacity:.45}
.line .row{display:flex;gap:5px;align-items:center;flex-wrap:wrap;margin-bottom:5px}
.line .row:last-child{margin-bottom:0}
.line select{font-size:11.5px;padding:4px 5px;max-width:100%;flex:1 1 auto;min-width:0}
.line input[type=number]{width:60px;font-size:11.5px;padding:4px}
.line .lbl{color:var(--dim);font-size:10.5px;flex:none}
.line .del{margin-left:auto;color:var(--bad);background:none;border:none;font-size:17px;padding:0 6px}
.line .lid{color:#4d5566;font-size:10px;font-family:ui-monospace,monospace}
.addline{width:100%;margin-top:2px}

/* ── 作戰畫面 ── */
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
.toolbar label{display:flex;gap:5px;align-items:center;font-size:11.5px;color:var(--dim)}
#log{max-height:62vh;min-height:220px;overflow-y:auto;padding:8px 10px;
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11.5px;line-height:1.7;
  background:#12141a;border-radius:0 0 7px 7px;-webkit-overflow-scrolling:touch}
#log div{border-bottom:1px solid #191c23;padding:1px 0;white-space:pre-wrap;word-break:break-word}
#log .tick{color:#4d5566;margin-right:6px}
.l-phase{color:var(--acc);font-weight:700;margin-top:6px}
.l-initiative{color:#7fd1c1}
.l-round-end{color:var(--warn);font-weight:700;margin-top:9px;border-top:1px solid var(--line);padding-top:4px}
.l-logic{color:#5a6270}
.l-logic-trigger{color:var(--warn)}
.l-action{color:#c3c9d4}
.l-lifo{color:#8a7fb8}
.l-intercept{color:#d98cc7;font-weight:600}
.l-hit{color:var(--ok)} .l-miss{color:#6b7280} .l-crit{color:#ffd166;font-weight:700}
.l-dodge{color:#7fd1c1} .l-block{color:#9cd0f0}
.l-damage{color:var(--phys)} .l-heal{color:var(--ok)}
.l-status,.l-status-expire{color:#8a93a5}
.l-stamina,.l-stamina-regen{color:#5f7fa8}
.l-exhaustion{color:var(--warn);font-weight:700}
.l-capacity,.l-capacity-restore{color:var(--magic)}
.l-suppressed{color:#a06a6a} .l-line-restore{color:var(--ok)}
.l-frenzy{color:var(--bad);font-weight:700;background:#2a1a1a}
.l-death,.l-bleeding{color:var(--bad);font-weight:700}
.l-spell{color:var(--magic)} .l-spell-intercept{color:#d98cc7}
.l-hazard,.l-hazard-expire{color:#c98a4b}
.l-multi-strike{color:#7fd1c1}
.l-post-round{color:#5a6270}
.l-victory{color:var(--ok);font-weight:700;background:#152a1d;padding:5px}
.l-defeat{color:var(--bad);font-weight:700;background:#2a1515;padding:5px}

/* ── v2.1 巢狀因果縮排與雙層粒度標記 ── */
#log div.depth-1{padding-left:14px;border-left:2px solid #2b3344}
#log div.depth-2{padding-left:28px;border-left:2px solid #6ea8fe}
#log div.depth-3{padding-left:42px;border-left:2px solid #d98cc7}
#log div.depth-4{padding-left:56px;border-left:2px solid #e8b84b}
.traittag{display:inline-block;background:#1e2636;color:var(--acc);border:1px solid #2f3e5c;
  border-radius:4px;padding:1px 6px;font-size:10.5px;margin-right:5px;margin-top:3px}
.traittag.pure{background:#2a2215;color:var(--warn);border-color:#59441e}
.strike-badge{color:#7fd1c1;font-weight:600}

.l-flesh-absorb{color:#e0a96d;font-weight:600}
.l-flesh-shatter{color:#ff8a5b;font-weight:700;background:#261a14}
.l-flesh-attack{color:#f4a261;font-weight:700}
.l-flesh-flood{color:#ff5a5f;font-weight:700;background:#2b1418}
.l-morale{color:#a8dadc}
.l-rout{color:#e63946;font-weight:700;background:#2d1215}
.l-acoustic{color:#7fd1c1}
.l-chaotic{color:#ff6b6b;font-weight:700;background:#2a151b}
.l-paralyzed{color:#c98a4b;font-weight:600}
.l-drag{color:#6ea8fe;font-weight:700}
.l-promote{color:#ffd166;font-weight:700;background:#2b2512}
.fleshbar{padding:6px 10px;background:#181c24;border-bottom:1px solid var(--line);display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:11.5px}
.fleshbar select{font-size:11.5px;padding:4px 6px}
.acoustic-tag{display:inline-block;padding:1px 6px;border-radius:4px;font-size:10.5px;font-family:ui-monospace,monospace}
.acoustic-tag.ok{background:#152a1d;color:var(--ok);border:1px solid #254a33}
.acoustic-tag.delay{background:#2a2418;color:var(--warn);border:1px solid #4a3f22}

/* ── iPhone / iOS Safari 專屬適配 ── */
header{
  padding-top:max(8px, env(safe-area-inset-top));
  padding-left:max(12px, env(safe-area-inset-left));
  padding-right:max(12px, env(safe-area-inset-right));
}
.screen{
  padding-bottom:max(24px, calc(env(safe-area-inset-bottom) + 16px));
}
button,select,input{
  -webkit-tap-highlight-color:transparent;
  touch-action:manipulation;
}
.fleshbar select{
  max-width:100%;
  min-width:0;
  flex:1 1 180px;
  text-overflow:ellipsis;
}
@media (max-width: 600px){
  select,input[type=number],input[type=text]{
    font-size:16px !important;
    padding:6px 8px;
  }
  .line select{
    font-size:16px !important;
    flex:1 1 100%;
  }
  .unitcard>.hd{
    flex-direction:column;
    align-items:flex-start;
  }
  .slotpick{
    width:100%;
  }
  .fleshbar{
    flex-direction:column;
    align-items:stretch;
  }
  .fleshbar select{
    width:100%;
    flex:none;
  }
}

/* ── v2.3 大地圖、共用 INT 帳本與全自動遠征發條 ── */
.camphud{display:grid;grid-template-columns:repeat(auto-fit,minmax(105px,1fr));gap:6px;margin-bottom:10px}
.camphud .cbox{background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:7px 9px}
.camphud .cbox .k{color:var(--dim);font-size:10.5px}
.camphud .cbox .v{font-size:14px;font-weight:700;margin-top:2px;font-family:ui-monospace,monospace}
.nodecard{border:1px solid var(--line);border-radius:6px;padding:10px;margin-bottom:8px;background:var(--panel2);transition:border-color .15s}
.nodecard.active{border-color:var(--acc);background:#1b2230}
.nodecard.cleared{opacity:.65;border-color:#254a33}
.nodecard.locked{opacity:.42}
.nodecard .nhd{display:flex;justify-content:space-between;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:4px}
.nodecard .nhd b{font-size:13.5px}
.badge{display:inline-block;padding:1px 7px;border-radius:4px;font-size:10.5px;font-weight:600}
.badge.now{background:var(--acc);color:#0b0d12}
.badge.done{background:#152a1d;color:var(--ok);border:1px solid #254a33}
.badge.lock{background:#1e222b;color:var(--dim)}
.badge.hazard{background:#2a2215;color:var(--warn);border:1px solid #59441e}
.badge.campline{background:#2b2313;color:#f5b942;border:1px solid #6b5322;margin-left:4px}
.badge.combatline{background:#162436;color:#7ab8ff;border:1px solid #2a476b;margin-left:4px}
.line.is-camp{border-left:3px solid #f5b942;background:#191814}
.top-tabs{display:flex;gap:4px;margin-right:auto;margin-left:10px;flex-wrap:wrap}
.top-tabs button{padding:4px 8px;font-size:11.5px;background:var(--panel2);color:var(--dim);border:1px solid var(--line)}
.top-tabs button.on{background:#1f293d;color:var(--acc);border-color:var(--acc);font-weight:600}
.explog{display:flex;flex-direction:column;gap:6px;max-height:360px;overflow-y:auto;padding:4px}
.expentry{padding:8px 10px;border-radius:6px;background:var(--panel2);border-left:3px solid var(--acc);font-size:12px;line-height:1.45}
.expentry.camp{border-left-color:#f5b942;background:#1b1913}
.expentry.loot{border-left-color:var(--ok);background:#131f18}
.expentry.ambush{border-left-color:var(--bad);background:#261316}
.expentry.retreat{border-left-color:#e05263;background:#2a1217}
.btn-danger{background:#3a151c !important;border-color:#8a2be2 !important;border:1px solid #c93b4b !important;color:#ffb3bc !important;font-weight:700}
.btn-danger:hover{background:#521c26 !important}
.lock-banner{padding:9px 12px;border-radius:6px;background:#261c10;border:1px solid #735118;color:#f5c469;font-size:12px;margin-bottom:10px}

/* ── v2.4 公會宏觀經營 (Guild Macro Management) ── */
.gmgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));gap:8px;margin-top:6px}
.gmcard{border:1px solid var(--line);border-radius:6px;padding:10px;background:var(--panel2);display:flex;flex-direction:column;gap:5px;transition:border-color .15s}
.gmcard.active{border-color:#f5b942;background:#211c12;box-shadow:inset 0 0 0 1px #6b5322}
.gmcard .gmhd{display:flex;justify-content:space-between;align-items:center;gap:6px}
.gmcard .gmhd b{font-size:13.5px;color:var(--fg)}
.gmcard.active .gmhd b{color:#f5b942}
.depotgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:8px}
.depotbox{border:1px solid var(--line);border-radius:6px;padding:10px;background:var(--panel2);display:flex;flex-direction:column;gap:6px}
.rostercard{border:1px solid var(--line);border-radius:6px;padding:10px;margin-bottom:8px;background:var(--panel2)}
.rostercard .rhd{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:6px;margin-bottom:6px}
.badge.gm{background:#2b2313;color:#f5b942;border:1px solid #6b5322}

/* ── v2.5 Pitch Slice: Split-Screen Manga Diorama (35% Top / 65% Bottom) & Skeuomorphic Gambit Rack ── */
.inspector-shell{display:flex;flex-direction:column;height:calc(100vh - 64px);height:calc(100dvh - 64px);min-height:580px;gap:8px}
.diorama-top{flex:0 0 36%;min-height:215px;max-height:290px;background:#0c0f16;border:2px solid #2b3548;border-radius:8px;position:relative;overflow:hidden;display:flex;flex-direction:column;justify-content:space-between;padding:6px 8px;box-shadow:inset 0 0 30px rgba(0,0,0,.75)}
.diorama-topbar{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:11px;z-index:4;background:rgba(12,15,22,.82);padding:3px 8px;border-radius:4px;border:1px solid #232b3a;flex-wrap:wrap}
.diorama-stage{position:relative;flex:1;display:grid;grid-template-columns:1fr 28px 1fr;gap:4px;align-items:center;z-index:2;margin-top:2px}
.diorama-side{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:4px;height:100%;align-items:stretch}
.clash-divider{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;color:#f5b942;font-weight:800;font-size:10px;letter-spacing:1px;border-left:1px dashed #4a3f22;border-right:1px dashed #4a3f22;background:rgba(245,185,66,.05)}
.clash-divider.interlocked{background:rgba(255,90,95,.14);border-color:#ff5a5f;color:#ff8a8e}
.dslot{border:1px solid #252d3d;border-radius:5px;background:#131822;padding:4px;display:flex;flex-direction:column;justify-content:space-between;position:relative;font-size:10px;transition:transform .05s}
.dslot.empty{opacity:.32;background:#0e121a;border-style:dashed}
.dslot.active-actor{border-color:#f5b942;box-shadow:0 0 10px rgba(245,185,66,.45);background:#1d1b14}
.dslot.active-target{border-color:#ff5a5f;box-shadow:0 0 10px rgba(255,90,95,.45);background:#241419}
.dslot.shattered{border-color:#ff8a5b;background:#261712}
.dslot .slot-num{position:absolute;top:2px;right:4px;font-size:9.5px;color:var(--dim);font-family:ui-monospace,monospace}
.dslot .uplink-pill{font-size:9px;padding:1px 4px;border-radius:3px;display:inline-block;max-width:82%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dslot .uplink-pill.ok{background:#12291e;color:#4cd97b;border:1px solid #23523a}
.dslot .uplink-pill.delay{background:#2b2212;color:#f5b942;border:1px solid #5c4722}
.dslot .uplink-pill.severed{background:#2d1216;color:#ff6b6b;border:1px solid #6b222c}

/* Bone Portrait Frame with BGM2 Auto-Slicing + Reactive Shaders */
.bone-portrait{
  margin:3px 0;padding:4px;border-radius:4px;min-height:66px;
  background-color:#1a2130;
  background-image:linear-gradient(180deg, rgba(12,15,22,0.18) 0%, rgba(10,13,20,0.88) 78%), var(--portrait-url, none);
  background-repeat:no-repeat;
  background-size:100% 100%, calc(var(--focal-zoom, 1.15) * 135%) auto;
  background-position:center center, var(--focal-x, 50%) var(--focal-y, 24%);
  border:1px solid #313d54;position:relative;overflow:hidden;
  display:flex;flex-direction:column;justify-content:flex-end;
}
.bone-portrait.shader-mana{box-shadow:inset 0 0 10px rgba(86,182,255,.65);border-color:#4da3ff}
.bone-portrait.shader-bleeding{border-color:#ff4d5e;box-shadow:inset 0 0 14px rgba(255,40,60,.75)}
.bone-portrait.shader-frenzy{border-color:#d95cff;box-shadow:inset 0 0 12px rgba(217,92,255,.7)}
.bone-portrait .bname{font-weight:700;font-size:10.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#f0f4fc;text-shadow:0 1px 3px #000}
.bone-portrait .bsub{font-size:9px;color:#cbd5e1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 1px 2px #000}
.microbar{height:4px;background:#0b0d12;border-radius:2px;overflow:hidden;margin-top:2px}
.microbar > i{display:block;height:100%}
.flesh-chassis{padding:3px 4px;border-radius:4px;background:#171512;border:1px solid #3d3526}
.flesh-chassis.paralyzed{border-color:#c98a4b;opacity:.75}
.flesh-chassis.routed{border-color:#e63946;background:#261215;opacity:.55}
.flesh-chassis .fname{font-size:9.5px;font-weight:600;color:#e8c48e;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.flesh-chassis .fmetrics{font-size:8.8px;color:var(--dim);display:flex;justify-content:space-between;gap:2px;font-family:ui-monospace,monospace}
.lead-pill{display:inline-block;background:#33240d;color:#ffd166;border:1px solid #7a581b;font-size:8.5px;padding:0 3px;border-radius:3px;margin-top:2px}
.diorama-svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:3}
.manga-cutin{position:absolute;left:8%;right:8%;top:18%;bottom:14%;z-index:5;background:repeating-linear-gradient(-25deg,#120d16,#120d16 8px,#1f1426 8px,#1f1426 16px);border:3px solid #f0f4fc;box-shadow:0 0 0 3px #0b0d12,0 8px 28px rgba(0,0,0,.85);clip-path:polygon(4% 0,100% 0,96% 100%,0 100%);display:none;align-items:center;justify-content:space-between;padding:0 18px 0 0;pointer-events:none;overflow:hidden}
.manga-cutin.on{display:flex}
.manga-cutin .mc-eyeline-art{
  width:42%;height:100%;
  background-color:#0b0e17;
  background-image:var(--cutin-url, none);
  background-repeat:no-repeat;
  background-size:calc(var(--cutin-zoom, 1.15) * 225%) auto;
  background-position:var(--cutin-x, 50%) var(--cutin-y, 24%);
  border-right:3px solid #f5b942;
  flex-shrink:0;
}
.manga-cutin .mc-eye{font-size:19px;font-weight:900;letter-spacing:1px;color:#ffd166;text-shadow:2px 2px 0 #000}
.manga-cutin .mc-meta{text-align:right;flex:1;padding-left:10px}
.manga-cutin .mc-tag{display:inline-block;background:#ff4d5e;color:#fff;font-weight:800;font-size:10px;padding:1px 6px;border-radius:3px}
.manga-cutin .mc-act{font-size:13px;font-weight:800;color:#fff;margin-top:2px}

/* Bottom 65% Split (Layout A) */
.inspector-bottom{flex:1;min-height:310px;display:grid;grid-template-columns:64% 1fr;gap:8px;overflow:hidden}
.log-pane{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:8px;background:var(--panel);overflow:hidden}
.log-body-wrap{flex:1;display:grid;grid-template-columns:1fr 22px;overflow:hidden;position:relative}
.scrub-log{overflow-y:auto;padding:6px 8px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11.8px;line-height:1.5}
.scrub-row{padding:3px 6px;border-radius:4px;cursor:pointer;border-left:2px solid transparent;display:flex;align-items:baseline;gap:6px}
.scrub-row:hover{background:#1c2433}
.scrub-row.battle-summary-row{background:#172030;border:1px solid #324463;border-left:4px solid #56b6ff;padding:6px 8px;margin:4px 0;font-weight:700;color:#eaf2ff;align-items:center}
.scrub-row.battle-summary-row:hover{background:#1f2c42;border-color:#7ab8ff}
.scrub-row.battle-child-row{border-left:2px solid #283347;margin-left:10px}
.exp-caret{display:inline-block;padding:1px 7px;border-radius:4px;font-size:10.5px;font-weight:700;background:#24344f;color:#7ab8ff;border:1px solid #3d5885;white-space:nowrap}
.exp-caret.open{background:#2b2313;color:#f5b942;border-color:#6b5322}
.scrub-row.active-snap{background:#232d42 !important;border-left:3px solid #f5b942 !important;box-shadow:inset 0 0 0 1px rgba(245,185,66,.35)}
.scrub-row .s-idx{color:var(--dim);font-size:10px;min-width:44px}
.inflection-rail{background:#0d1017;border-left:1px solid var(--line);position:relative;height:100%}
.inf-mark{position:absolute;left:2px;right:2px;height:6px;border-radius:2px;cursor:pointer;opacity:.88}
.inf-mark:hover{opacity:1;transform:scaleX(1.15)}
.inf-mark.LIFO_INTERCEPT{background:#56b6ff}
.inf-mark.SLOT_SHATTERED{background:#ff8a5b}
.inf-mark.BLEEDING_OUT{background:#ff4d5e}
.inf-mark.CHAOTIC_AMBUSH{background:#d95cff}
.inf-mark.MANDATE_TRIGGER{background:#f5b942}

/* Right 35% Enemy Blank Gambit Rack & Auto-Forensics */
.forensics-pane{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:8px;background:var(--panel);overflow:hidden}
.forensics-scroll{flex:1;overflow-y:auto;padding:8px}
.enemy-rack-card{border:1px solid #2c3547;border-radius:6px;background:#11151f;padding:8px;margin-bottom:8px}
.fplate{border:1px solid #2b3344;border-radius:5px;padding:6px 8px;margin-top:5px;background:#161b26;font-size:11px}
.fplate.unrevealed{opacity:.45;border-style:dashed;text-align:center;color:var(--dim);padding:8px}
.fplate.revealed{border-left:3px solid #ff6b6b;background:#1d161b}
.fplate.locked-recon{border-left:3px solid #4cd97b;background:#13211a}
.cand-chip{display:inline-block;padding:1px 5px;border-radius:3px;font-size:10px;margin:1px 2px;background:#232a38;color:#b8c4d9;border:1px solid #384359}
.cand-chip.exact{background:#142e20;color:#6be396;border-color:#296342;font-weight:700}

/* Skeuomorphic Gambit Rack (Pillar 29) */
.rack-frame{border:2px solid #453a26;border-radius:8px;background:linear-gradient(180deg,#161820 0%,#101218 100%);padding:10px;margin-top:6px;box-shadow:inset 0 2px 10px rgba(0,0,0,.7)}
.rack-rail-hd{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:6px;padding-bottom:6px;border-bottom:1px solid #332b1d;margin-bottom:8px;font-size:11.5px}
.gambit-plate{border:1px solid #4d422c;border-left:5px solid #d4a349;border-radius:6px;background:#1c1f29;padding:7px 9px;margin-bottom:6px;position:relative;display:flex;flex-direction:column;justify-content:center;gap:5px;box-shadow:0 2px 5px rgba(0,0,0,.45)}
.gambit-plate.w-1{min-height:48px}
.gambit-plate.w-2{min-height:68px;border-left-width:6px}
.gambit-plate.w-3{min-height:88px;border-left-width:7px}
.gambit-plate.w-4{min-height:108px;border-left-width:8px}
.gambit-plate.side-clip{margin-left:18px;border-left:4px solid #56b6ff;border-style:dashed;background:#141d29}
.gambit-plate.prefix-seal{border-left:6px solid #e63946;background:#241519;border-color:#6b2630}
.gambit-plate.suppressed-plate{opacity:.42;border-left-color:#ff4d5e;background:#211215}
.plate-sockets{display:flex;flex-wrap:wrap;align-items:center;gap:5px}
.socket-box{background:#11141c;border:1px solid #30384a;border-radius:4px;padding:3px 6px;display:flex;align-items:center;gap:4px}
